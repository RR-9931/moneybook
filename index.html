<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>书斋</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#eaeeec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="书斋">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.5/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=LXGW+WenKai+TC&family=Literata:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css" rel="stylesheet">
<style>
:root{
  --bg:#eaeeec; --surface:#f7f9f8; --ink:#1c2523; --muted:#63706b; --line:#cfd8d4;
  --accent:#356f62; --accent-ink:#ffffff; --danger:#9c4236; --shadow:0 1px 2px rgba(20,30,28,.12),0 6px 18px rgba(20,30,28,.08);
  --ui:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Noto Serif SC","Songti SC",STSong,serif;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121817; --surface:#1a2120; --ink:#dde5e2; --muted:#93a19c; --line:#2c3735;
    --accent:#7fc0ae; --accent-ink:#0e1615; --danger:#e08a7d; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121817; --surface:#1a2120; --ink:#dde5e2; --muted:#93a19c; --line:#2c3735;
  --accent:#7fc0ae; --accent-ink:#0e1615; --danger:#e08a7d; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
:root[data-theme="light"] body{color-scheme:light}

/* ---------- Library ---------- */
.lib{max-width:1040px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 64px}
.lib-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.lib-head h1{font-family:var(--serif);font-weight:700;font-size:44px;line-height:1;margin:0;letter-spacing:.06em}
.sync{font-size:13px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--accent)} .dot.warn{background:#c2902d} .dot.err{background:var(--danger)}
.head-actions{display:flex;gap:8px;align-items:center;flex:none}
.head-actions .btn{white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.icon{padding:9px 13px}
.btn.danger{color:var(--danger)}
.resume{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:26px}
.resume .mini{width:34px;height:46px;border-radius:3px;flex:none;background:var(--c)}
.resume b{font-family:var(--serif);font-size:17px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume small{color:var(--muted);font-size:13px}
.resume .go{margin-left:auto;color:var(--accent);font-weight:600;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:26px 18px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0}
.card-open{all:unset;cursor:pointer;display:block;border-radius:4px}
.card-open:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cover{position:relative;aspect-ratio:3/4;background:var(--c);border-radius:3px 5px 5px 3px;box-shadow:var(--shadow);overflow:hidden}
.cover::before{content:"";position:absolute;left:9%;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.18)}
.cover .label{position:absolute;right:12%;top:9%;width:30%;max-height:72%;background:#f4f1e8;color:#2a2622;
  writing-mode:vertical-rl;text-orientation:mixed;font-family:var(--serif);font-weight:600;font-size:14px;line-height:1.15;
  padding:8px 4px;overflow:hidden;letter-spacing:.08em;border:1px solid rgba(0,0,0,.08)}
.cover img.cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover.has-img::before{display:none}
.cover.has-img .fmt,.cover.has-img .saved{text-shadow:0 1px 3px rgba(0,0,0,.8);color:#fff}
.resume .mini img{width:100%;height:100%;object-fit:cover;border-radius:3px;display:block}
.cover .fmt{position:absolute;left:16%;bottom:7%;font-size:10px;color:rgba(255,255,255,.75);letter-spacing:.05em}
.cover .saved{position:absolute;left:16%;top:7%;font-size:10px;color:rgba(255,255,255,.75)}
.card .t{font-size:14px;line-height:1.35;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent)}
.card .more{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.28);color:#fff;font-size:15px;line-height:1}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:44px 24px;text-align:center;color:var(--muted)}
.empty p{max-width:30em;margin:0 auto 18px;line-height:1.7}
.recs{display:flex;flex-direction:column;gap:10px;max-height:58vh;overflow-y:auto;margin:4px 0}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.rec b{font-family:var(--serif);font-size:17px;display:block}
.rec .m2{font-size:12px;color:var(--muted);margin:3px 0 6px}
.modal .rec p{margin:0 0 10px;font-size:14px;line-height:1.65;color:var(--ink)}
.rec .cp{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13px}
.rec .cp.done{color:var(--accent);border-color:var(--accent)}
.rec-status{color:var(--muted);font-size:14px;line-height:1.7;padding:6px 0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 18px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;display:flex;align-items:center;gap:6px}
.chip small{color:var(--muted);font-size:12px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on small{color:var(--accent-ink);opacity:.8}
.chip.add{color:var(--muted);border-style:dashed}
.sec-h{font-family:var(--ui);font-size:14px;font-weight:600;color:var(--muted);margin:34px 0 14px;letter-spacing:.06em}
#grid>.sec-h:first-child{margin-top:4px}
.sec-empty{color:var(--muted);font-size:14px;line-height:1.7}
.card.st-dropped .cover,.card.st-done .cover{opacity:.72}
.cover .tick{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.28);color:transparent;display:grid;place-items:center;font-size:14px;font-weight:700}
.card.sel .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card.sel .cover{outline:3px solid var(--accent);outline-offset:2px;opacity:1}
.selbar{position:fixed;left:8px;right:8px;margin:0 auto;width:fit-content;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:16px;padding:6px;display:flex;align-items:center;gap:2px;box-shadow:var(--shadow);max-width:calc(100vw - 16px);overflow-x:auto}
.selbar span{padding:0 10px;font-size:14px;white-space:nowrap}
.selbar button{background:none;border:0;color:inherit;padding:9px 10px;border-radius:10px;font-size:14px;white-space:nowrap}
.selbar button.danger{color:#ff9b8f}
.selbar button:disabled{opacity:.35}
body.selecting .lib{padding-bottom:130px}
.pick{max-height:52vh;overflow-y:auto;margin:4px 0;border:1px solid var(--line);border-radius:12px}
.pick label{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pick label:last-child{border-bottom:0}
.pick input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.pick .pm{width:30px;height:40px;border-radius:3px;background:var(--c);flex:none;overflow:hidden}
.pick .pm img{width:100%;height:100%;object-fit:cover;display:block}
.pick .pt{flex:1;min-width:0}
.pick .pt b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .pt small{color:var(--muted);font-size:12px}
.btn:disabled{opacity:.45}
.auth{position:fixed;inset:0;z-index:95;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow-y:auto}
.auth-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 22px;box-shadow:var(--shadow);animation:popIn .4s var(--ease) both}
.auth h1{font-family:var(--serif);font-size:40px;letter-spacing:.06em;margin:0 0 8px}
.auth-sub{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 18px}
.auth form{display:flex;flex-direction:column;gap:12px}
.auth label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.auth input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.auth #cfgFields,.auth #loginFields{display:flex;flex-direction:column;gap:12px}
.auth #cfgFields[hidden],.auth #loginFields[hidden]{display:none}
.auth .btn{width:100%;border-radius:12px;padding:12px}
.auth-msg{min-height:1.4em;margin:0;font-size:13px;color:var(--danger);line-height:1.5}
.auth-msg.ok{color:var(--accent)}
.foot{margin-top:40px;font-size:12px;color:var(--muted);line-height:1.7}

/* ---------- Modal / busy ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,15,14,.42);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);color:var(--ink);width:min(520px,100%);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
@media (min-width:700px){.scrim{align-items:center}.modal{border-radius:18px;padding-bottom:20px}}
.modal h3{margin:0 0 4px;font-family:var(--serif);font-size:19px}
.modal p{margin:0 0 6px;color:var(--muted);font-size:14px;line-height:1.6}
.modal .btn{width:100%;border-radius:12px;padding:12px}
.busy{position:fixed;left:12px;right:12px;margin:0 auto;width:fit-content;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:12px;font-size:14px;max-width:min(92vw,520px);box-shadow:var(--shadow);line-height:1.5}

/* ---------- Reader ---------- */
.reader{position:fixed;inset:0;z-index:50;background:var(--rbg);color:var(--rink);
  --rbg:var(--surface);--rink:var(--ink);--rmuted:var(--muted);--rline:var(--line);
  --fs:19px;--lh:1.85;--mg:22px;--ff:var(--serif)}
.reader[data-rt="white"]{--rbg:#fbfbf9;--rink:#232323;--rmuted:#7a7a74;--rline:#e2e2dc}
.reader[data-rt="paper"]{--rbg:#ece3cf;--rink:#3a3125;--rmuted:#83745d;--rline:#d6c9ae}
.reader[data-rt="green"]{--rbg:#cde2cf;--rink:#20301f;--rmuted:#5b7259;--rline:#b2cdb4}
.reader[data-rt="night"]{--rbg:#111413;--rink:#a7b1ad;--rmuted:#6a7571;--rline:#262c2a}
.scroller{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;overflow-anchor:none}
.content{max-width:40em;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 34px) var(--mg) calc(env(safe-area-inset-bottom,0px) + 56px);
  font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);text-align:justify;word-break:normal;overflow-wrap:break-word}
.content p{margin:0 0 .45em;text-indent:2em}
.reader.noindent .content p{text-indent:0;margin-bottom:.8em}
.content.en p{text-indent:0;margin-bottom:.85em;hyphens:auto;-webkit-hyphens:auto}
.content h1,.content h2,.content h3,.content h4{font-weight:600;line-height:1.4;text-indent:0;text-align:left;margin:.4em 0 1.1em}
.content h1{font-size:1.45em}.content h2{font-size:1.3em}.content h3{font-size:1.15em}
.content .ch-title{font-size:1.35em;margin:0 0 1.4em}
.content img{max-width:100%;height:auto;display:block;margin:1em auto;border-radius:2px}
.content blockquote{margin:1em 0;padding-left:1em;border-left:3px solid var(--rline);color:var(--rmuted)}
.content pre{white-space:pre-wrap;font-size:.85em}
.content table{border-collapse:collapse;font-size:.9em;display:block;overflow-x:auto}
.content td,.content th{border:1px solid var(--rline);padding:4px 8px}
.chap+.chap{margin-top:3.2em;padding-top:2.4em;border-top:1px solid var(--rline)}
.book-end{text-align:center;color:var(--rmuted);font-family:var(--ui);font-size:14px;margin:3em 0 1em;text-indent:0}
.ch-end{display:flex;justify-content:space-between;gap:12px;margin-top:3em;padding-top:1.4em;border-top:1px solid var(--rline);font-family:var(--ui);font-size:15px}
.ch-end button{background:none;border:1px solid var(--rline);border-radius:10px;padding:10px 14px;color:var(--rink);max-width:48%;text-align:left;line-height:1.4}
.ch-end button span{display:block;font-size:12px;color:var(--rmuted)}
.ch-end .next{margin-left:auto;text-align:right}
.loading{font-family:var(--ui);color:var(--rmuted);text-align:center;padding-top:30vh;line-height:1.7;font-size:15px;text-indent:0}
.loading .btn{margin-top:14px}

.pdfwrap{padding:calc(env(safe-area-inset-top,0px) + 12px) 0 calc(env(safe-area-inset-bottom,0px) + 40px)}
.pdfpage{position:relative;width:min(100%,960px);margin:0 auto 10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.pdfpage canvas{position:absolute;inset:0;width:100%;height:100%}
.pdfpage .pn{position:absolute;inset:0;display:grid;place-items:center;color:#999;font-size:13px}
.reader[data-rt="night"] .pdfpage canvas,.reader[data-rt="night"] .pdfpage{filter:invert(.9) hue-rotate(180deg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .reader[data-rt="auto"] .pdfpage{filter:invert(.9) hue-rotate(180deg)}}

.rbar{position:absolute;left:0;right:0;z-index:5;background:var(--rbg);color:var(--rink);border-color:var(--rline);
  transition:transform .22s ease,opacity .22s ease;font-family:var(--ui)}
.rbar.top{top:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 8px;border-bottom:1px solid var(--rline);display:flex;align-items:center;gap:8px}
.rbar.bottom{bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--rline)}
.reader:not(.chrome) .rbar.top{transform:translateY(-100%);opacity:0;pointer-events:none}
.reader:not(.chrome) .rbar.bottom{transform:translateY(100%);opacity:0;pointer-events:none}
.rbtn{background:none;border:0;padding:8px 10px;border-radius:8px;font-size:15px;color:var(--rink);white-space:nowrap}
.rtitle{flex:1;min-width:0;text-align:center;font-size:14px;color:var(--rmuted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow{display:flex;align-items:center;gap:8px}
.prow input[type=range]{flex:1;accent-color:var(--accent)}
.prow2{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--rmuted)}
.prow2 #rPos{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.rmini{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);text-align:center;font-family:var(--ui);font-size:11px;color:var(--rmuted);pointer-events:none;opacity:.8}
.reader.chrome .rmini{opacity:0}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--rbg);color:var(--rink);border-top:1px solid var(--rline);
  border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:72%;display:flex;flex-direction:column;font-family:var(--ui);
  padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){.sheet{left:auto;right:16px;bottom:16px;width:380px;border-radius:16px;border:1px solid var(--rline)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
.sheet-head b{font-size:16px}
.toc{overflow-y:auto;padding:0 8px 12px}
.toc button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 12px;border-radius:8px;font-size:15px;color:var(--rink);line-height:1.4}
.toc button.cur{color:var(--accent);font-weight:600}
.toc button.l2{padding-left:28px;font-size:14px}
.aa{overflow-y:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.row>span:first-child{width:4.5em;flex:none;font-size:14px;color:var(--rmuted)}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.seg{display:flex;flex:1;border:1px solid var(--rline);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:9px 4px;font-size:14px;color:var(--rink);border-left:1px solid var(--rline)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.sizebox{display:flex;flex:1;align-items:center;justify-content:space-between}
.sizebox button{width:52px;height:38px;border:1px solid var(--rline);border-radius:10px;background:none;color:var(--rink)}
.sw{display:flex;gap:10px;flex:1}
.sw button{width:38px;height:38px;border-radius:50%;border:2px solid var(--rline);font-size:11px}
.sw button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--rbg) inset}
.tog{display:flex;align-items:center;justify-content:space-between;font-size:14px}
.tog input{width:20px;height:20px;accent-color:var(--accent)}
.note{font-size:13px;color:var(--rmuted);line-height:1.6}
.toast{position:absolute;left:12px;right:12px;margin:0 auto;width:fit-content;max-width:520px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:9;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:12px 10px 12px 18px;display:flex;align-items:center;gap:14px;font-family:var(--ui);font-size:14px;line-height:1.5;box-shadow:var(--shadow)}
.toast .tmsg{flex:1;min-width:0;display:flex;flex-direction:column}
.toast .tmsg small{font-size:12px;opacity:.7}
.toast .tmsg b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap}
.toast .x{background:none;color:inherit;opacity:.7;padding:7px 6px}
mark.hl{background:rgba(250,204,21,.42);color:inherit;border-radius:2px;padding:0 1px;cursor:pointer}
.reader[data-rt="night"] mark.hl{background:rgba(202,160,40,.36)}
.hlpill{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);z-index:9;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 22px;font-family:var(--ui);font-size:15px;font-weight:600;box-shadow:var(--shadow)}
.toc .hlitem{display:flex;gap:8px;align-items:flex-start;padding:8px 4px 8px 12px;border-bottom:1px solid var(--rline)}
.toc .hlitem .go{flex:1;width:auto;padding:4px 0;font-size:15px;line-height:1.55}
.toc .hlitem .go span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;border-left:3px solid rgba(250,204,21,.85);padding-left:9px}
.toc .hlitem .go small{display:block;color:var(--rmuted);font-size:12px;margin:4px 0 0 12px}
.toc .hlitem .del{width:auto;display:inline-block;color:var(--rmuted);padding:6px 8px}
.toc .hl-empty{padding:18px 12px;color:var(--rmuted);font-size:14px;line-height:1.7}
.sheet-head .seg{flex:0 0 auto;width:170px}
/* ---------- motion ---------- */
:root{--ease:cubic-bezier(.22,.8,.24,1);--ease-in:cubic-bezier(.4,0,.8,.4)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{opacity:.4;transform:translateY(100%)}to{opacity:1;transform:none}}
@keyframes sheetOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(40%)}}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes popOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.97) translateY(6px)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pillIn{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.9)}100%{opacity:1;transform:translateX(-50%)}}
@keyframes hlIn{from{background-color:rgba(250,204,21,0)}50%{background-color:rgba(250,204,21,.75)}to{background-color:rgba(250,204,21,.42)}}
@keyframes tickPop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes readerIn{from{opacity:0;transform:translateY(24px) scale(.985)}to{opacity:1;transform:none}}
@keyframes readerOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(18px) scale(.985)}}
.reader.entering{animation:readerIn .34s var(--ease) both}
.reader.leaving{animation:readerOut .22s var(--ease-in) both;pointer-events:none}
.reader{transition:background-color .35s ease,color .35s ease}
.content.fadein{animation:fadeIn .32s ease both}
.rbar{transition:transform .3s var(--ease),opacity .25s ease!important}
.sheet:not([hidden]){animation:sheetIn .34s var(--ease) both}
.sheet.out{animation:sheetOut .2s var(--ease-in) both;pointer-events:none}
@media (min-width:760px){.sheet:not([hidden]){animation-name:popIn}.sheet.out{animation-name:popOut}}
.scrim{animation:fadeIn .22s ease both}
.scrim .modal{animation:sheetIn .34s var(--ease) both}
@media (min-width:700px){.scrim .modal{animation-name:popIn}}
.scrim.out{animation:fadeOut .2s ease both;pointer-events:none}
.scrim.out .modal{animation:sheetOut .2s var(--ease-in) both}
@media (min-width:700px){.scrim.out .modal{animation-name:popOut}}
.toast:not([hidden]){animation:dropIn .36s var(--ease) both}
.busy:not([hidden]){animation:riseIn .3s var(--ease) both}
.hlpill:not([hidden]){animation:pillIn .28s var(--ease) both}
.selbar:not([hidden]){animation:riseIn .3s var(--ease) both}
mark.hl.fresh{animation:hlIn .7s ease both}
.grid.anim .card{animation:riseIn .45s var(--ease) both;animation-delay:calc(var(--i,0) * 28ms)}
.resume.anim{animation:riseIn .45s var(--ease) both}
.cover{transition:transform .25s var(--ease),box-shadow .25s ease,opacity .25s ease}
.card-open:active .cover{transform:scale(.96)}
@media (hover:hover){.card-open:hover .cover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(20,30,28,.14),0 12px 26px rgba(20,30,28,.14)}}
.card.sel .tick{animation:tickPop .3s var(--ease)}
.bar i{transition:width .6s var(--ease)}
.chip,.btn,.rbtn,.seg button,.sw button,.resume,.toc button{transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .15s ease,opacity .2s ease}
.chip:active,.btn:active,.resume:active,.sw button:active{transform:scale(.96)}
.rbtn:active,.toc button:active{opacity:.55}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (prefers-reduced-motion: reduce){.rbar{transition:none}}
</style>
</head>
<body>

<section class="auth" id="auth" hidden>
  <div class="auth-card">
    <h1>书斋</h1>
    <p class="auth-sub" id="authSub">登入后，手机和 iPad 的书、进度和划线会自动同步。</p>
    <form id="authForm" autocomplete="on">
      <div id="cfgFields" hidden>
        <label>Supabase 项目网址<input id="cfgUrl" type="url" placeholder="https://xxxx.supabase.co" autocomplete="off"></label>
        <label>anon / publishable key<input id="cfgKey" type="text" placeholder="eyJ… 或 sb_publishable_…" autocomplete="off"></label>
      </div>
      <div id="loginFields">
        <label>电邮<input id="authEmail" type="email" autocomplete="username" required></label>
        <label>密码<input id="authPass" type="password" autocomplete="current-password" minlength="6" required></label>
      </div>
      <p class="auth-msg" id="authMsg" role="alert"></p>
      <button class="btn primary" id="authGo" type="submit">登入</button>
      <button class="btn" id="authSwitch" type="button">第一次用？注册账号</button>
    </form>
  </div>
</section>

<main class="lib" id="lib">
  <div class="lib-head">
    <div>
      <h1>书斋</h1>
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">正在连接…</span></div>
    </div>
    <div class="head-actions">
      <button class="btn" id="recBtn" hidden>✨ 荐书</button>
      <button class="btn icon" id="libMore" aria-label="更多">⋯</button>
      <button class="btn primary" id="addBtn">添加书籍</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <button class="resume" id="resume" hidden></button>
  <div id="grid"></div>
  <div class="empty" id="empty" hidden>
    <p>书架还是空的。从手机或 iPad 里选一本 TXT、EPUB、PDF、DOCX 开始，传上去之后两台设备都能读，进度会自动同步。</p>
    <button class="btn primary" id="addBtn2">选择文件</button>
  </div>
  <div class="foot" id="foot"></div>
  <input type="file" id="fileIn" multiple hidden>
  <div class="selbar" id="selBar" hidden>
    <span id="selN"></span>
    <button data-a="all" id="selAll">全选</button>
    <button data-a="group" data-need>分组</button>
    <button data-a="status" data-need>标记</button>
    <button data-a="del" data-need class="danger">删除</button>
    <button data-a="cancel">完成</button>
  </div>
</main>

<div class="reader" id="reader" hidden data-rt="auto">
  <div class="scroller" id="scroller"><article class="content" id="content"></article></div>
  <div class="rmini" id="rMini"></div>
  <header class="rbar top">
    <button class="rbtn" id="rBack">‹ 书架</button>
    <div class="rtitle" id="rTitle"></div>
    <button class="rbtn" id="rScBtn" hidden>繁</button>
    <button class="rbtn" id="rFsBtn">全屏</button>
    <button class="rbtn" id="rTocBtn">目录</button>
  </header>
  <footer class="rbar bottom">
    <div class="prow">
      <button class="rbtn" id="rPrev">上一章</button>
      <input type="range" id="rSlider" min="0" max="0" step="1" aria-label="跳转">
      <button class="rbtn" id="rNext">下一章</button>
    </div>
    <div class="prow2"><span id="rPos"></span><button class="rbtn" id="rAaBtn" aria-label="阅读设置">Aa 设置</button></div>
  </footer>

  <section class="sheet" id="sheetToc" hidden>
    <div class="sheet-head"><div class="seg" id="tocSeg"><button data-v="toc" class="on">目录</button><button data-v="hl">划线</button></div><button class="rbtn" data-close>完成</button></div>
    <div class="toc" id="tocList"></div>
  </section>

  <section class="sheet" id="sheetAa" hidden>
    <div class="sheet-head"><b>阅读设置</b><button class="rbtn" data-close>完成</button></div>
    <div class="aa">
      <div class="row textonly"><span>字号</span>
        <div class="sizebox"><button id="fsDown" aria-label="缩小">A−</button><b id="fsVal">19</b><button id="fsUp" aria-label="放大">A+</button></div></div>
      <div class="row textonly"><span>字体</span>
        <div class="seg" id="fontSeg">
          <button data-v="sans">黑体</button><button data-v="serif">宋体</button><button data-v="kai">楷体</button><button data-v="latin">英文</button>
        </div></div>
      <div class="row textonly"><span>行距</span><input type="range" id="lhIn" min="1.4" max="2.5" step="0.05"></div>
      <div class="row textonly"><span>页边距</span><input type="range" id="mgIn" min="8" max="72" step="2"></div>
      <div class="row"><span>背景</span>
        <div class="sw" id="themeSw">
          <button data-v="white" style="background:#fbfbf9" aria-label="白"></button>
          <button data-v="paper" style="background:#ece3cf" aria-label="纸"></button>
          <button data-v="green" style="background:#cde2cf" aria-label="护眼绿"></button>
          <button data-v="night" style="background:#111413" aria-label="夜间"></button>
        </div></div>
      <label class="tog textonly">首行缩进<input type="checkbox" id="indentIn"></label>
      <label class="tog">点屏幕左右两侧翻页<input type="checkbox" id="tapIn"></label>
      <label class="tog">打开书时自动全屏<input type="checkbox" id="autoFsIn"></label>
      <label class="tog">翻页动画<input type="checkbox" id="animIn"></label>
      <div class="note pdfonly" hidden>PDF 按原版排版显示，字号和字体设置不适用。夜间背景会把页面反色。</div>
      <div class="note">设置只保存在这台设备上，所以手机和 iPad 可以用不同的字号。</div>
      <button class="rbtn" id="dbgBtn" style="align-self:flex-start;color:var(--rmuted);font-size:13px;padding:4px 0">调试记录</button>
    </div>
  </section>
  <button class="hlpill" id="hlPill" hidden>✎ 划线</button>
  <div class="toast" id="rToast" hidden></div>
</div>

<div class="busy" id="busy" hidden></div>

<script>
(() => {
'use strict';
/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const LIB = {
  jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
  pdfw: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  opencc: 'https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js'
};
const loaded = {};
function loadScript(src) {
  if (!loaded[src]) loaded[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src;
    s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error('需要联网下载解析组件，请连上网再试')); };
    document.head.appendChild(s);
  });
  return loaded[src];
}
async function loadPdfJs() {
  await loadScript(LIB.pdfw); await loadScript(LIB.pdf);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIB.pdfw;
  return window.pdfjsLib;
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const COLORS = ['#3c5c70', '#6a4c37', '#356f62', '#7a3b46', '#4a4e7a', '#5a6838', '#86672c', '#2e5b58', '#5b3f63', '#804a2c'];
function colorFor(s) { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
const FMT_LABEL = { txt: 'TXT', md: 'MD', epub: 'EPUB', pdf: 'PDF', docx: 'DOCX', html: 'HTML' };
function fmtSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

const DEV = (() => {
  let id = LS.get('sz.dev'); if (!id) { id = newId(); LS.set('sz.dev', id); }
  const ua = navigator.userAgent;
  let name = '电脑';
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) name = 'iPad';
  else if (/iPhone/.test(ua)) name = 'iPhone';
  else if (/Android/.test(ua)) name = /Mobile/.test(ua) ? '手机' : '平板';
  return { id, name };
})();

/* ---------------- IndexedDB (offline book cache) ---------------- */
const idb = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('shuzhai', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('books');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => {
    try {
      const d = await open();
      return await new Promise((res, rej) => { const q = fn(d.transaction('books', mode).objectStore('books')); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    } catch (e) { return undefined; }
  };
  return {
    get: k => run('readonly', s => s.get(k)),
    put: (k, v) => run('readwrite', s => s.put(v, k)),
    del: k => run('readwrite', s => s.delete(k)),
    keys: async () => (await run('readonly', s => s.getAllKeys())) || []
  };
})();

/* ---------------- state ---------------- */
const S = { animGrid: true, db: null, assets: null, uid: null, remote: [], books: new Map(), cached: new Set(), sync: 'connecting', cur: null, hl: {}, noHide: 0, userAct: 0 };
const DEF = { size: 19, lh: 1.85, font: 'serif', theme: 'white', margin: 22, indent: true, tap: true, autoFs: true, anim: true };
let SET = Object.assign({}, DEF, LS.get('sz.set', {}));
if (!['white', 'paper', 'green', 'night'].includes(SET.theme)) SET.theme = 'white';
if (SET.script === 'orig') SET.script = 'hans';
/* iPad can wipe this page's local storage, so each device type also keeps its settings in the cloud */
const DEVKEY = { iPad: 'ipad', iPhone: 'iphone', '手机': 'phone', '平板': 'tablet', '电脑': 'desktop' }[DEV.name] || 'other';
let setT;
function pushSettings() { clearTimeout(setT); setT = setTimeout(() => { if (S.db && S.uid) S.db.doc('data/users/' + S.uid + '/set_' + DEVKEY).set(Object.assign({}, SET)).catch(() => {}); }, 800); }
const cacheKey = b => b.asset || ('local:' + b.id);
const docPath = id => 'data/users/' + S.uid + '/book_' + id;

function localProg(id) { return LS.get('sz.p.' + id, null); }
function effProg(b) {
  const l = localProg(b.id), r = b.progress;
  if (l && (!r || (l.at || 0) >= (r.at || 0))) return l;
  return r || null;
}
function rebuildBooks() {
  const m = new Map();
  for (const r of S.remote) m.set(r.id, r);
  for (const r of LS.get('sz.local', [])) m.set(r.id, Object.assign({}, r, { localOnly: true }));
  S.books = m;
}

/* ---------------- sync status ---------------- */
function setSync(state) {
  S.sync = state;
  const map = {
    connecting: ['', '正在连接…'],
    ok: ['ok', '已同步 · ' + DEV.name],
    slow: ['warn', '同步服务暂时连不上，先显示本机记录'],
    offline: ['warn', '离线中，进度会在联网后同步'],
    local: ['warn', '还没登入'],
    nosql: ['err', '云端还没建好资料表：去 Supabase 跑 setup.sql'],
    err: ['err', '同步出错，重新打开页面再试']
  };
  const [cls, txt] = map[state] || map.connecting;
  $('#syncDot').className = 'dot ' + cls; $('#syncText').textContent = txt;
}
window.addEventListener('offline', () => { if (S.db) setSync('offline'); });
window.addEventListener('online', () => { if (S.db) { setSync('ok'); flushRemote(); } });

/* ---------------- library ---------------- */
function lastTouch(b) { const p = effProg(b); return Math.max(p ? p.at || 0 : 0, b.addedAt || 0); }
function progLabel(b, p) {
  if (!p) return '未开始';
  if (p.pct >= 0.995) return '已读完';
  return Math.max(1, Math.round(p.pct * 100)) + '%';
}
function goodCover(c) { return typeof c === 'string' && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(c); }
function makeThumb(src) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      try {
        const w = 240, h = Math.round(im.naturalHeight * w / im.naturalWidth) || 320;
        const c = document.createElement('canvas'); c.width = w; c.height = Math.min(h, 480);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, c.height); g.drawImage(im, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.72));
      } catch (e) { res(null); }
    };
    im.onerror = () => res(null); im.src = src;
  });
}
/* books uploaded before covers existed: pull the cover out of the saved EPUB */
let coverBusy = false;
async function backfillCovers() {
  if (coverBusy || !S.db) return; coverBusy = true;
  try {
    for (const b of [...S.books.values()]) {
      if (b.fmt !== 'epub' || b.cover || b.localOnly || LS.get('sz.cv.' + b.id)) continue;
      LS.set('sz.cv.' + b.id, 1);
      const data = await ensureCached(b); if (!data) continue;
      let src = null;
      try { for (const c of (JSON.parse(data).chapters || []).slice(0, 3)) { const m = /<img[^>]+src="(data:image\/[^"]+)"/.exec(c.h); if (m) { src = m[1]; break; } } } catch (e) {}
      if (!src) continue;
      const th = await makeThumb(src); if (!th) continue;
      try { await S.db.doc(docPath(b.id)).update({ cover: th }); } catch (e) {}
    }
  } finally { coverBusy = false; }
}
async function refreshCached() { S.cached = new Set(await idb.keys()); }

/* ---------------- modal / busy ---------------- */
function modal(title, text, actions) {
  return new Promise(res => {
    const scrim = el('div', 'scrim'); const m = el('div', 'modal'); m.setAttribute('role', 'dialog');
    m.append(el('h3', '', title)); if (text) m.append(el('p', '', text));
    for (const a of actions) {
      const b = el('button', 'btn' + (a.cls ? ' ' + a.cls : ''), a.label);
      b.onclick = () => { closeScrim(scrim); res(a.v); }; m.append(b);
    }
    scrim.onclick = e => { if (e.target === scrim) { closeScrim(scrim); res(null); } };
    scrim.append(m); document.body.append(scrim); m.querySelector('button').focus();
  });
}
let busyT;
function busy(msg, ms) {
  const b = $('#busy'); clearTimeout(busyT);
  if (!msg) { b.hidden = true; return; }
  b.textContent = msg; b.hidden = false;
  if (ms) busyT = setTimeout(() => { b.hidden = true; }, ms);
}

/* ---------------- multi-select & adding books to a group ---------------- */
async function updateMany(books, patch) {
  const loc = LS.get('sz.local', []);
  for (const b of books) {
    if (b.localOnly) { const x = loc.find(y => y.id === b.id); if (x) Object.assign(x, patch); }
    else {
      const r = S.remote.find(x => x.id === b.id); if (r) Object.assign(r, patch);
      if (S.db) writing = writing.then(() => S.db.doc(docPath(b.id)).update(patch)).catch(() => busy('有些改动没存到云端，检查网络后再试', 2500));
    }
  }
  LS.set('sz.local', loc); LS.set('sz.lib', S.remote); rebuildBooks(); renderLibrary();
}
async function chooseGroup(title, cur) {
  const gs = allGroups();
  const acts = gs.map(g => ({ label: (cur === g ? '✓ ' : '') + g, v: 'g:' + g }));
  acts.push({ label: (cur === '' ? '✓ ' : '') + '不分组', v: 'g:' }, { label: '＋ 新建分组', v: 'new' }, { label: '取消', v: null });
  const v = await modal(title, '', acts);
  if (v === 'new') {
    const name = await askText('新分组名字', '', '例如：小说、学习成长'); if (!name) return null;
    if (!S.groups.includes(name)) saveGroups(S.groups.concat([name]));
    return name;
  }
  return v == null ? null : v.slice(2);
}
function setSelect(on) {
  S.sel = on ? new Set() : null;
  document.body.classList.toggle('selecting', !!on);
  renderLibrary();
}
function visibleBooks() {
  return [...S.books.values()].filter(b => S.grp === '' ? true : S.grp === '__none' ? !b.group : b.group === S.grp);
}
function renderSelBar() {
  const bar = $('#selBar'); bar.hidden = !S.sel; if (!S.sel) return;
  const n = S.sel.size;
  $('#selN').textContent = n ? '已选 ' + n + ' 本' : '点书本来选择';
  bar.querySelectorAll('[data-need]').forEach(b => { b.disabled = !n; });

function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function autoDrive() {}
async function exportAll() {

  const name = '书斋备份-' + todayStr() + '.json';
  const file = new File([json], name, { type: 'application/json' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const u = URL.createObjectURL(file); const a = document.createElement('a'); a.href = u; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000); busy('已导出', 1800);

async function importAll() {
  if (!S.db) { busy('先登入再导入', 2000); return; }

  let data;
  try {
    const txt = (await f.text()).replace(/^﻿/, '').trim();
    data = JSON.parse(txt);
    if (Array.isArray(data)) data = { docs: data };
    if (!data || !Array.isArray(data.docs)) throw new Error('shape');
  } catch (e) {
    await modal('读不到这个文件', '《' + f.name + '》不是书斋的备份文件。要选 Google Drive「Wei Hang Apps 备份 / 书斋」里面名字像「书斋备份-2026-11-26.json」的文件，不是「说明」那个。', [{ label: '知道了', v: 1 }]);
    return;
  }
  const now = Date.now(); let books = 0, waiting = 0, done = 0;
  const total = data.docs.filter(d => d && d.id && d.data).length;
  try {
    for (const d of data.docs) {
      if (!d || !d.id || !d.data) continue;
      busy('正在导入 ' + (++done) + '/' + total + '…');
      const v = Object.assign({}, d.data);
      if (d.id.startsWith('book_')) {
        books++;
        const have = S.books.get(d.id.slice(5));
        if (have && have.asset && !have.needFile) { v.asset = have.asset; v.parts = have.parts || null; v.b64 = !!have.b64; v.needFile = false; }
        else { v.asset = null; v.parts = null; v.b64 = false; v.needFile = true; waiting++; }
      }
      if (d.id.startsWith('hl_')) { v.at = now; LS.del('sz.hl.' + d.id.slice(3)); }
      if (d.id.startsWith('set_')) v.at = now;
      await S.db.doc('data/users/' + S.uid + '/' + d.id).set(v);
    }
  } catch (e) {

    if (blob.size > MAX) throw new Error('这本书解析后超过 300 MB，太大了');

  const text = decodeText(await f.arrayBuffer()).replace(/\r\n?/g, '\n').replace(/\u0000/g, '');
  if ((text.match(/\uFFFD/g) || []).length > text.length * 0.05) throw new Error('看不懂这个文件的格式。支持 TXT、EPUB、PDF、DOCX、HTML、Markdown');

}

async function importFiles(files) {

      const r = await parseFile(f);
      const norm = t => String(t || '').replace(/\s+/g, '').toLowerCase();
      const waitingBook = [...S.books.values()].find(x => x.needFile && x.kind === r.kind && norm(x.title) === norm(r.title.slice(0, 120)));
      if (waitingBook) { busy(null); await replaceBook(waitingBook, f, r); ok++; continue; }
      const id = newId();
      const row = { title: r.title.slice(0, 120), author: r.author.slice(0, 80), fmt: r.fmt, kind: r.kind, size: r.blob.size, lang: r.lang, count: r.count, addedAt: Date.now(), progress: null, asset: null, cover: r.cover || null, status: 'reading', group: S.grp && S.grp !== '__none' ? S.grp : '' };
      if (S.db && S.assets) {
        busy('正在上传《' + row.title + '》（' + fmtSize(r.blob.size) + '）…');
        let up;
        try { up = await uploadBook(r, row.title); }
        catch (e) {
          if (e && e.code === 'too_large') throw new Error('文件太大，上传失败');
          if (e && e.code === 'quota_or_state') throw new Error('云端空间满了，删掉几本不读的书再试');
          throw new Error('上传失败，检查网络后再试');
        }
        row.asset = up.asset; if (up.parts) { row.parts = up.parts; row.b64 = up.b64; }
        await idb.put(up.asset, r.cache);
        await S.db.doc(docPath(id)).set(row);
        S.remote = S.remote.filter(x => x.id !== id).concat([Object.assign({ id }, row)]); LS.set('sz.lib', S.remote);
      } else {
        await idb.put('local:' + id, r.cache);
        LS.set('sz.local', LS.get('sz.local', []).concat([Object.assign({ id }, row)]));
      }
      ok++;
    } catch (e) {
      busy(null);
      await modal('《' + f.name + '》没有加进书架', e.message || String(e), [{ label: '知道了', v: 1 }]);
    }
  }
  rebuildBooks(); await refreshCached(); renderLibrary();
  if (ok) busy(ok === 1 ? '已加入书架' : '已加入 ' + ok + ' 本书', 2200); else busy(null);
}

async function ensureCached(b) {

  if (!b.asset || b.needFile) return null;
  try {
    if (Array.isArray(b.parts) && b.parts.length > 1) {
      const txt = [];
      for (const id of b.parts) { const r = await blobFetch(id); if (!r.ok) throw new Error(); txt.push(await r.text()); }

const dirty = new Set(LS.get('sz.dirty', []));
let flushT, writing = Promise.resolve();
function saveProg(id, p) {
  /* opening a book or restoring a position is not reading: only save after the reader touches something */
  if (S.cur && S.cur.id === id && S.userAct < (S.cur.openedAt || 0)) return;
  /* same spot as last time: don't re-stamp it as "newer" (closing the book or switching apps on the phone
     used to re-save an old position with a fresh time and overwrite what the iPad had read since) */
  const l = localProg(id);
  if (l && l.ch === p.ch && (l.para == null ? null : l.para) === (p.para == null ? null : p.para) && Math.abs((l.pf || 0) - (p.pf || 0)) < 0.02 && Math.abs((l.off || 0) - (p.off || 0)) < 0.01) return;
  p.at = Date.now(); p.dev = DEV.id; p.devName = DEV.name;
  LS.set('sz.p.' + id, p);
  const b = S.books.get(id); if (!b || b.localOnly) return;
  dirty.add(id); LS.set('sz.dirty', [...dirty]);

}
function flushRemote() {
  clearTimeout(flushT);

  for (const id of [...dirty]) {
    const p = localProg(id); const b = S.books.get(id);
    if (!p || !b || b.localOnly) { dirty.delete(id); continue; }
    writing = writing.then(() => S.db.doc(docPath(id)).update({ progress: p }))
      .then(() => { const l = localProg(id); if (l && l.at === p.at) { dirty.delete(id); LS.set('sz.dirty', [...dirty]); } })
      .catch(e => { if (e && e.code === 'invalid_argument') { dirty.delete(id); LS.set('sz.dirty', [...dirty]); } });
  }
}

    for (const id of [...cache.keys()]) if (!seen.has(id)) { cache.delete(id); ver.delete(id); changed = true; }
    for (let i = 0; i < need.length; i += 50) {
      const { data, error: e2 } = await SB.from('docs').select('id,data,updated_at').in('id', need.slice(i, i + 50));
      if (e2) throw e2;

    repull();

        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'docs' }, onRow)

    } catch (e) {}

    start, all: () => [...cache.entries()].map(([id, data]) => ({ id, data })),
    doc(path) {
      const id = String(path).split('/').pop();
      return {
        id, path,
        async get() { const { data, error } = await SB.from('docs').select('data').eq('id', id).maybeSingle(); if (error) throw fail(error); return { id, exists: !!data, data: () => data ? data.data : undefined, metadata: { fromCache: false, hasPendingWrites: false } }; },
        async set(d) { const { data, error } = await SB.from('docs').upsert({ user_id: uid, id, data: d }).select('id,data,updated_at').single(); if (error) throw fail(error); keep(id, data); },
        async update(patch) {
          const { data, error } = await SB.rpc('merge_doc', { p_id: id, p_patch: patch }); if (error) throw fail(error);
          const row = Array.isArray(data) ? data[0] : data;
          if (!row || !row.id) { const x = new Error('这条资料已经不存在'); x.code = 'invalid_argument'; throw x; }
          keep(id, row);
        },
        async delete() { const { error } = await SB.from('docs').delete().eq('id', id); if (error) throw fail(error); if (cache.delete(id)) { ver.delete(id); emit(); } }
      };
    },

  };
}
function makeAssets(uid) {

      const vp = page.getViewport({ scale: w / page.getViewport({ scale: 1 }).width });
      const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      d.append(c); rendered.push(i);
      for (let k = 0; rendered.length > 12 && k < 40; k++) { const j = rendered.shift(); const cv = pages[j].querySelector('canvas'); if (cv && !visible.has(j)) { cv.width = 0; cv.remove(); } else if (cv) rendered.push(j); }
    } catch (e) {} finally { delete d.dataset.busy; }
  };
  const visible = new Set();
  const io = new IntersectionObserver(es => { for (const e of es) { const i = +e.target.dataset.i; if (e.isIntersecting) { visible.add(i); render(i); } else visible.delete(i); } }, { root: scroller, rootMargin: '150% 0px' });
  pages.forEach(p => io.observe(p));
  const pageH = () => pages[0].offsetHeight + 10;
  const top0 = () => pages[0].offsetTop;
  const pos = () => { const y = scroller.scrollTop - top0() + 1; const h = pageH(); const i = Math.max(0, Math.min(n - 1, Math.floor(y / h))); return { i, off: Math.max(0, Math.min(1, (y - i * h) / h)) }; };
  const slider = $('#rSlider'); slider.max = n - 1; slider.step = 1;
  v.go = (i, off) => { S.noHide = Date.now() + 1200; i = Math.max(0, Math.min(n - 1, i | 0)); scroller.scrollTop = top0() + (i + (off || 0)) * pageH(); v.ch = i; v.ui(); v.save(); };
  v.pct = () => { const p = pos(); return Math.min(1, (p.i + p.off + (scroller.clientHeight / pageH()) * 0) / n); };
  v.ui = () => { const p = pos(); v.ch = p.i; const pct = Math.round(((p.i + 1) / n) * 1000) / 10; $('#rPos').textContent = '第 ' + (p.i + 1) + ' / ' + n + ' 页　' + pct + '%'; $('#rMini').textContent = (p.i + 1) + ' / ' + n; slider.value = p.i; $('#rPrev').disabled = p.i === 0; $('#rNext').disabled = p.i === n - 1; };
  let t;
  v.save = (now) => { clearTimeout(t); const doit = () => { const p = pos(); saveProg(b.id, { ch: p.i, off: Math.round(p.off * 10000) / 10000, pct: Math.round(((p.i + 1) / n) * 10000) / 10000, label: '第 ' + (p.i + 1) + ' 页' }); }; if (now) doit(); else t = setTimeout(doit, 700); };
  v.pageBy = dir => { smoothBy(dir * (scroller.clientHeight - 40)); };
  v.label = () => '第 ' + (pos().i + 1) + ' 页';
  let outline = null;
  try {
    const ol = await doc.getOutline();
    if (ol && ol.length) {
      outline = [];
      const walk = async (items, lvl) => { for (const it of items) { try { const dest = typeof it.dest === 'string' ? await doc.getDestination(it.dest) : it.dest; if (dest && dest[0]) outline.push({ t: it.title, ch: await doc.getPageIndex(dest[0]), lvl }); } catch (e) {} if (lvl < 2 && it.items && it.items.length) await walk(it.items, lvl + 1); } };
      await walk(ol, 1);
      if (!outline.length) outline = null;
    }
  } catch (e) {}
  v.toc = () => outline || pages.map((_, i) => ({ t: '第 ' + (i + 1) + ' 页', ch: i, lvl: 1 }));
  v.destroy = () => { clearTimeout(t); io.disconnect(); try { doc.destroy(); } catch (e) {} content.style.maxWidth = ''; };
  slider.oninput = () => { $('#rPos').textContent = '第 ' + (+slider.value + 1) + ' / ' + n + ' 页'; };
  slider.onchange = () => v.go(+slider.value, 0);
  return v;
}

/* --- reader interactions --- */
let scrollRaf;
scroller.addEventListener('scroll', () => {
  if (!S.cur) return;
  /* iPad can reset the scroll position while the app is in the background: ignore those scrolls */
  if (document.hidden) return;
  if (Date.now() < (S.restoreUntil || 0) && S.userAct < (S.visibleAt || 0)) return;
  /* only a scroll the reader made can move the reading position; anything else (iPad resets, layout shifts) snaps back */
  const nowT = Date.now();
  const isUser = nowT - (S.resizeAt || 0) > 1000 && (touching || nowT - S.userAct < 6000 || nowT - (S.lastUserScroll || 0) < 600);
  if (!isUser) { if (Math.abs(scroller.scrollTop - (S.lastTop || 0)) > 40) dbg('nonUser scroll'); if (S.cur.apply && S.cur.anchor) S.cur.apply('snap'); S.lastTop = scroller.scrollTop; return; }
  S.lastUserScroll = nowT;
  { const tp = scroller.scrollTop; if (S.lastTop != null && Math.abs(tp - S.lastTop) > scroller.clientHeight * 1.2) dbg('bigScroll Δ' + Math.round(tp - S.lastTop) + (touching ? ' touching' : '') + ' sinceAct=' + (nowT - S.userAct)); S.lastTop = tp; }
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => { scrollRaf = null; if (!S.cur) return; if (Date.now() - (S.resizeAt || 0) < 1000) return; if (R.classList.contains('chrome') && $('#sheetToc').hidden && $('#sheetAa').hidden && Date.now() > S.noHide) chrome(false); if (S.cur.extend) { S.cur.extend(false); S.cur.scrolled(); } else if (S.cur.track) S.cur.track(); if (S.cur.ch !== S.lastCh) { dbg('ch→' + S.cur.ch); S.lastCh = S.cur.ch; } S.cur.ui(); S.cur.save(); });
}, { passive: true });
scroller.addEventListener('click', e => {
  if (!S.cur || e.target.closest('button,a')) return;
  if (!$('#sheetToc').hidden || !$('#sheetAa').hidden) { closeSheets(); return; }
  const sel = window.getSelection && String(window.getSelection()); if (sel) return;
  const mk = e.target.closest('mark.hl'); if (mk) { hlMenu(mk.dataset.hl); return; }
  const x = e.clientX / window.innerWidth;
  if (SET.tap && x < 0.3) { chrome(false); S.cur.pageBy(-1); }
  else if (SET.tap && x > 0.7) { chrome(false); S.cur.pageBy(1); }
  else chrome(!R.classList.contains('chrome'));
});
document.addEventListener('keydown', e => {
  if (R.hidden || !S.cur || e.target.closest('input')) return;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); S.cur.pageBy(1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); S.cur.pageBy(-1); }
  else if (e.key === 'Escape') { if (!$('#sheetToc').hidden || !$('#sheetAa').hidden) closeSheets(); else closeReader(); }
});
$('#rPrev').onclick = () => S.cur && S.cur.go(S.cur.ch - 1, 0);
$('#rNext').onclick = () => S.cur && S.cur.go(S.cur.ch + 1, 0);
$('#rAaBtn').onclick = () => { $('#sheetToc').hidden = true; $('#sheetAa').classList.remove('out'); $('#sheetAa').hidden = false; };
let tocMode = 'toc';
function fillToc() {
  const v = S.cur; if (!v) return;
  const list = $('#tocList'); list.textContent = '';
  const isPdf = v.kind === 'pdf';
  $('#tocSeg').hidden = isPdf; if (isPdf) tocMode = 'toc';
  document.querySelectorAll('#tocSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === tocMode));
  if (tocMode === 'hl') {
    const items = HL.get(v.id).items.slice().sort((a, b) => a.ch - b.ch || a.p - b.p || a.o - b.o);
    if (!items.length) { list.append(el('div', 'hl-empty', '还没有划线。长按选取一段文字，再按下面出现的「✎ 划线」就会保存，手机和 iPad 都看得到。')); return; }
    for (const h of items) {
      const row = el('div', 'hlitem');
      const go = el('button', 'go'); go.append(el('span', '', h.text), el('small', '', v.chTitle ? v.chTitle(h.ch) : ''));
      go.onclick = () => { closeSheets(); chrome(false); v.go(h.ch, 0, { ch: h.ch, para: h.p, pf: 0 }); };
      const del = el('button', 'del', '✕'); del.setAttribute('aria-label', '删除划线');
      del.onclick = () => { HL.set(v.id, HL.get(v.id).items.filter(x => x.id !== h.id)); if (v.refreshMarks) v.refreshMarks(); fillToc(); };
      row.append(go, del); list.append(row);
    }
    return;
  }
  let curBtn = null; const items = v.toc();
  let best = -1; items.forEach((it, i) => { if (it.ch <= v.ch) best = i; });
  items.forEach((it, i) => {
    const btn = el('button', (it.lvl > 1 ? 'l2' : '') + (i === best ? ' cur' : ''), it.t);
    btn.onclick = () => { closeSheets(); chrome(false); v.go(it.ch, 0); };
    if (i === best) curBtn = btn; list.append(btn);
  });
  if (curBtn) requestAnimationFrame(() => curBtn.scrollIntoView({ block: 'center' }));
}
$('#tocSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; tocMode = b.dataset.v; fillToc(); };
$('#rTocBtn').onclick = () => {
  if (!S.cur) return;
  $('#sheetAa').hidden = true; $('#sheetToc').classList.remove('out'); $('#sheetToc').hidden = false; fillToc();
};

/* --- highlights: select text → ✎ 划线 --- */
let hlRange = null, hlAt = 0;
document.addEventListener('selectionchange', () => {
  const pill = $('#hlPill');
  if (R.hidden || !S.cur || !S.cur.captureRange) { pill.hidden = true; return; }
  const sel = window.getSelection();
  if (sel && sel.rangeCount && !sel.isCollapsed && content.contains(sel.anchorNode) && String(sel).trim()) {
    hlRange = sel.getRangeAt(0).cloneRange(); hlAt = Date.now(); pill.hidden = false;
  } else {
    const t0 = hlAt; setTimeout(() => { if (hlAt === t0) { pill.hidden = true; hlRange = null; } }, 1500);
  }
});
$('#hlPill').onclick = e => {
  e.stopPropagation();
  const v = S.cur, r = hlRange; $('#hlPill').hidden = true; hlRange = null; hlAt = Date.now();
  if (!v || !r || !v.captureRange) return;
  const c = v.captureRange(r); if (!c) { busy('这段文字没办法划线，换一段试试', 2500); return; }
  const nid = newId(); S.newHl = nid; setTimeout(() => { if (S.newHl === nid) S.newHl = null; }, 900);
  HL.set(v.id, HL.get(v.id).items.concat([Object.assign({ id: nid, at: Date.now() }, c)]));
  try { window.getSelection().removeAllRanges(); } catch (err) {}
  v.refreshMarks(); busy('已划线', 1500);
};
async function hlMenu(id) {
  const v = S.cur; if (!v) return;
  const h = HL.get(v.id).items.find(x => x.id === id); if (!h) return;
  const act = await modal('划线', h.text.length > 120 ? h.text.slice(0, 120) + '…' : h.text, [{ label: '复制文字', v: 'copy' }, { label: '删除划线', v: 'del', cls: 'danger' }, { label: '取消', v: null }]);
  if (act === 'copy') { try { await navigator.clipboard.writeText(h.text); busy('已复制', 1500); } catch (e) { busy('复制失败', 1500); } }
  if (act === 'del') { HL.set(v.id, HL.get(v.id).items.filter(x => x.id !== id)); v.refreshMarks(); }
}

$('#dbgBtn').onclick = () => {
  const scrim = el('div', 'scrim'); const m = el('div', 'modal');
  m.append(el('h3', '', '调试记录'), el('p', '', '出现跳位置后马上打开这里，按「复制」贴给 Claude。'));
  const ta = el('textarea'); ta.readOnly = true; ta.value = 'dev=' + DEV.name + ' ua=' + navigator.userAgent + '\n' + DBG.join('\n');
  ta.style.cssText = 'width:100%;height:45vh;font:11px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)';
  const cp = el('button', 'btn primary', '复制'); cp.onclick = async () => { try { await navigator.clipboard.writeText(ta.value); cp.textContent = '已复制'; } catch (e) { ta.focus(); ta.select(); cp.textContent = '请长按文字框手动复制'; } };
  const x = el('button', 'btn', '关闭'); x.onclick = () => closeScrim(scrim);
  m.append(ta, cp, x); scrim.append(m); scrim.onclick = e => { if (e.target === scrim) closeScrim(scrim); };
  document.body.append(scrim);
};

/* --- another device moved ahead --- */
function checkRemoteJump() {
  const v = S.cur; if (!v) return;
  const b = S.books.get(v.id); if (!b || !b.progress) return;
  const r = b.progress;
  if (r.dev === DEV.id || (r.at || 0) <= Math.max(v.startAt || 0, v.lastRemoteAt || 0)) return;
  v.lastRemoteAt = r.at;
  if (S.userAct < (v.openedAt || 0)) { dbg('remote auto-jump from ' + (r.devName || '?')); v.go(r.ch, r.off, r); return; }
  const l = localProg(v.id);
  if (l && r.ch === l.ch && Math.abs((r.off || 0) - (l.off || 0)) < 0.02) return;
  const toast = $('#rToast'); toast.textContent = '';
  const msg = el('span', 'tmsg');
  msg.append(el('small', '', (r.devName || '另一台设备') + ' 上读到了'), el('b', '', (r.label || '更后面') + '　' + Math.round((r.pct || 0) * 100) + '%'));
  toast.append(msg);
  const go = el('button', '', '跳过去'); go.onclick = () => { toast.hidden = true; v.go(r.ch, r.off, r); };
  const x = el('button', 'x', '✕'); x.setAttribute('aria-label', '关闭'); x.onclick = () => { toast.hidden = true; };
  toast.append(go, x); toast.hidden = false;
}

/* --- fullscreen reading mode --- */
function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement; }
var quietFs = false;
function enterFsQuiet() {
  const r = document.documentElement, req = r.requestFullscreen || r.webkitRequestFullscreen;
  if (!req) return;
  quietFs = true; setTimeout(() => { quietFs = false; }, 1500);
  try { const p = req.call(r, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}
function fsHelp() {
  const toast = $('#rToast'); toast.textContent = '';
  toast.append(el('span', '', '这里不允许网页全屏（iPhone 和部分 app 内浏览器有这个限制）。阅读时上下工具栏会自动隐藏，只剩正文。'));
  const x = el('button', 'x', '✕'); x.setAttribute('aria-label', '关闭'); x.onclick = () => { toast.hidden = true; };
  toast.append(x); toast.hidden = false;
  setTimeout(() => { toast.hidden = true; }, 6000);
}
function syncFsLabel() { $('#rFsBtn').textContent = fsEl() ? '退出全屏' : '全屏'; if (fsEl()) chrome(false); }
document.addEventListener('fullscreenchange', syncFsLabel);
document.addEventListener('webkitfullscreenchange', syncFsLabel);
document.addEventListener('fullscreenerror', () => { if (!quietFs) fsHelp(); });
document.addEventListener('webkitfullscreenerror', () => { if (!quietFs) fsHelp(); });
$('#rFsBtn').onclick = async () => {
  if (fsEl()) { try { await (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} return; }
  const r = document.documentElement;
  const req = r.requestFullscreen || r.webkitRequestFullscreen;
  if (!req || (document.fullscreenEnabled === false && !document.webkitFullscreenEnabled)) { fsHelp(); return; }
  try { await req.call(r, { navigationUI: 'hide' }); } catch (e) { fsHelp(); return; }
  chrome(false);
  setTimeout(() => { if (!fsEl()) fsHelp(); }, 700);
};

window.__SZ = { S, HL, closeReader: () => closeReader() };   /* handle for the debug log and tests */
connect();
})();
